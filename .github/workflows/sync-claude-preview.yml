name: Sync claude/* to claude-preview

on:
  push:
    branches:
      - 'claude/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout claude-preview
          git merge --ff-only ${{ github.ref_name }} || git merge -X theirs ${{ github.ref_name }}
          git push origin claude-preview
